# @spec docs/BACKLOG.md#sls-074 | docs/FUNCTION_CODE_HASH.md#calcul-opérateur-et-preuve-réelle
name: serverless-code-hash
services:
  code-hash:
    profiles: [dev]
    image: serverless-code-hash:dev
    build:
      context: ..
      dockerfile: control/Dockerfile.code-hash
    env_file: [/etc/spark/env, /run/spark/secrets]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 32
    tmpfs: ["/tmp:size=16m,mode=1777,noexec,nosuid"]
