# @spec docs/BACKLOG.md#sls-020 | docs/CONTROL.md | docs/PLATFORM_DEV.md
name: p2enjoy-serverless-dev
services:
  control:
    image: p2enjoy-control:dev
    build:
      context: ..
      dockerfile: control/Dockerfile
    env_file:
      - /etc/spark/env
      - /run/spark/secrets
    network_mode: host
    volumes:
      - ${SERVERLESS_STATE_HOST_PATH:?Chemin hôte requis}:/state
      - ${SERVERLESS_DOCKER_SOCKET_HOST:?Socket rootless requis}:/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
    init: true
    healthcheck:
      test: [CMD, python, -B, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18090/healthz',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
